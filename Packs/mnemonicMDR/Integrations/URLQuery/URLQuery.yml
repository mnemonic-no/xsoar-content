category: Data Enrichment & Threat Intelligence
commonfields:
  id: Urlquery
  version: -1
configuration:
- defaultvalue: https://api.xsoar-example.com
  display: Server URL (e.g., https://api.xsoar-example.com)
  name: url
  required: true
  section: Connect
  type: 0
- display: ''
  displaypassword: API Key
  hiddenusername: true
  name: credentials
  required: true
  section: Connect
  type: 9
- advanced: true
  display: Trust any certificate (not secure)
  name: insecure
  required: false
  section: Connect
  type: 8
- advanced: true
  display: Use system proxy settings
  name: proxy
  required: false
  section: Connect
  type: 8
description: Urlquery
display: Urlquery
name: Urlquery
script:
  commands:
  - arguments:
    - description: Urlquery report id
      name: report_id
      required: true
    - auto: PREDEFINED
      defaultValue: false
      description: Display report screenshot (Default False)
      name: include_screenshot
      predefined:
      - false
      - true
    - auto: PREDEFINED
      defaultValue: false
      description: Display report domain graph (Default False)
      name: include_domain_graph
      predefined:
      - false
      - true
    - auto: PREDEFINED
      defaultValue: false
      description: Display all http requests
      name: include_requests
      predefined:
      - false
      - true
    - auto: PREDEFINED
      defaultValue: false
      description: Display file artifacts
      name: include_artifacts
      predefined:
      - false
      - true
    description: Fetches report details for a given report ID
    name: urlquery-get-report
    outputs:
    - contextPath: Urlquery.Report
    - contextPath: Urlquery.Report.report_id
      description: Report ID
    - contextPath: Urlquery.Report.artifacts.files
      description: Node root for file artifacts
    - contextPath: Urlquery.Report.ip.addr
      description: IP address of url
    - contextPath: Urlquery.Report.http
      description: Node root for all http requests
    - contextPath: Urlquery.Report.stats.alert_count.analyzer
      description: Count TDS alerts
    - contextPath: Urlquery.Report.stats.alert_count.ids
      description: Count IDS alerts
    - contextPath: Urlquery.Report.stats.alert_count.urlquery
      description: Count urlquery alerts
  - arguments:
    - description: Urlquery report ID
      name: report_id
      required: true
    description: Fetches the Urlquery screenshot of a given report ID
    name: urlquery-get-report-screenshot
  - arguments:
    - description: Urlquery report ID
      name: report_id
      required: true
    description: Fetches the domain graph of a given report ID
    name: urlquery-get-report-domain-graph
  - arguments:
    - description: Url to be analysed
      name: url
      required: true
    - description: 'User Agent (Default: Mozilla/5.0 (X11; Linux x86_64; rv:96.0) Gecko/20100101 Firefox/96.0)'
      name: ua
    - description: Referer address (default none)
      name: referer
    - auto: PREDEFINED
      defaultValue: public
      description: Private or public access (Default public)
      name: access
      predefined:
      - private
      - restricted
      - public
    description: Submit url for analysis
    name: urlquery-submit-url
    outputs:
    - contextPath: Urlquery.Submit
    - contextPath: Urlquery.Submit.report_id
      description: The ID of the report when finalised
    - contextPath: Urlquery.Submit.queue_id
      description: The ID of the job analysing the submitted url
  - arguments:
    - description: Queue ID of the analysis job submitted to Urlquery
      name: queue_id
      required: true
    description: Returns the status of an analysis job
    name: urlquery-submit-status
  - arguments:
    - description: Url to search for
      name: url
      required: true
    - defaultValue: 10
      description: Limit the number of results
      name: limit
    - defaultValue: 0
      description: Offset for the search results
      name: offset
    description: Search for reports for an url
    name: urlquery-search
  - arguments:
    - description: URL to check reputation for
      name: url
      required: true
    description: Checks an URL's reputation in Urlquery
    name: url
  dockerimage: demisto/python3:3.10.13.87159
  runonce: false
  script: ''
  subtype: python3
  type: python
