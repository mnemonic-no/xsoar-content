commonfields:
  id: ArgusAddComment
  version: -1
name: ArgusAddComment
script: |
  register_module_line('ArgusAddComment', 'start', __line__())

  def main():
      args = demisto.args()
      tags = args.get("tags", [])
      field = args.get("field")
      if not field:
          return_error("Argument 'field' not given.")

      try:
          md = demisto.incidents()[0].get('CustomFields')[field]
      except Exception as e:
          return_error(f"Error getting comment content. field={field}, error={e}")
      if not md:
          return_error(f"Note field empty. Have you saved it? field={field}")

      # Argus wants a comment formatted in HTML
      html = demisto.executeCommand("mdToHtml", {"text": md})
      if not html:
          return_error("Invalid input, unable to convert MD to HTML")

      html = html[0].get("Contents", "")

      #  create tagged war room entry
      entry = {
          'Type' : entryTypes["note"],
          'Contents': html,
          'ContentsFormat' : formats["html"],
          'HumanReadable': html,
          'ReadableContentsFormat' : formats["html"],
          'Tags' : tags,
          'Note': True
      }

      # wipe editing field
      demisto.executeCommand("setIncident", {field:""})

      return_results(entry)


  if __name__ in ["__main__", "builtin", "builtins"]:
      main()

  register_module_line('ArgusAddComment', 'end', __line__())
type: python
tags:
- incident-action-button
comment: Add a comment in an Argus Case by creating a tagged Note in XSOAR incident. Uses the dbotMirrorTags context field.
enabled: true
args:
- name: tags
  description: Tags to add to Note
  isArray: true
- name: field
  required: true
  default: true
  description: Which field to grab comment from in incident
  defaultValue: commentcontent
  type: unknown
